[package]
name = "projeto-rpg-v2"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# O crate tem DOIS bins: este (src/main.rs, o app) e src/bin/exportar_semente.rs
# (utilitário de dev, rodado pelo publicar.ps1). Sem este desempate o tauri-cli
# escolhe sozinho e escolheu errado na v0.2.0 — o instalador saiu com o
# exportar_semente no lugar do app, e o atalho não abria nada.
default-run = "projeto-rpg-v2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projeto_rpg_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# Diálogo nativo de abrir/salvar arquivo (export/import de fichas). A leitura e
# a escrita em si ficam no Rust — por isso não precisa do plugin-fs.
tauri-plugin-dialog = "2"
# Auto-update via GitHub Releases (tags) + relaunch pós-update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# Cofre de segredos (resources/segredos.enc): o repo é público, então token do
# Discord e chaves Gemini viajam cifrados (AES-256-GCM, chave via scrypt da
# senha-mestra). Par com scripts/segredos-cifrar.mjs (node:crypto).
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
# Sync via Google Drive (docs/plans/2026-08-11-sync-google-drive.md): OAuth2+PKCE
# (Fase 1) e transporte (Fase 2+). Mesmas features do grimorio (app de referência).
oauth2 = "5"
keyring = "4"
tauri-plugin-oauth = "2"
# Mesma versao que o tauri costuma trazer (0.12.x); default-features = false
# mantem o TLS em rustls, unico stack de TLS presente na arvore hoje.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# So pelo canal oneshot e pelo timeout do login (Fase 1).
tokio = { version = "1", features = ["sync", "time"] }

