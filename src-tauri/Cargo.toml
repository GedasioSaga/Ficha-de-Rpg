[package]
name = "projeto-rpg-v2"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projeto_rpg_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# Diálogo nativo de abrir/salvar arquivo (export/import de fichas). A leitura e
# a escrita em si ficam no Rust — por isso não precisa do plugin-fs.
tauri-plugin-dialog = "2"
# Auto-update via GitHub Releases (tags) + relaunch pós-update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# Cofre de segredos (resources/segredos.enc): o repo é público, então token do
# Discord e chaves Gemini viajam cifrados (AES-256-GCM, chave via scrypt da
# senha-mestra). Par com scripts/segredos-cifrar.mjs (node:crypto).
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }

